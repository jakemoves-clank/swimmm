name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily, ~06:23 Toronto. The gate below skips the rebuild unless the
    # city has actually published new data, so deploys happen ~weekly.
    - cron: '23 10 * * *'
  workflow_dispatch:

# Deny by default; each job opts into only what it needs. In particular the
# build job — the only one that runs third-party code (npm deps, the SvelteKit
# build) — never holds pages:write or id-token:write.
permissions: {}

concurrency:
  group: pages
  # Never cancel a deployment midway through publishing.
  cancel-in-progress: false

jobs:
  gate:
    name: Check whether the city published new data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          # Only scheduled runs are gated; pushes and manual runs always build.
          if [ "$EVENT" != "schedule" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CKAN=https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show
          P=$(curl -sf --max-time 30 "$CKAN?id=registered-programs-and-drop-in-courses-offering" | jq -r .result.last_refreshed)
          F=$(curl -sf --max-time 30 "$CKAN?id=parks-and-recreation-facilities" | jq -r .result.last_refreshed)
          LIVE=$(curl -sf --max-time 30 "$SITE/stamp.txt" || echo "none")
          echo "city: $P|$F"
          echo "live: $LIVE"
          if [ "$LIVE" = "$P|$F" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build static site
    needs: gate
    if: needs.gate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Don't leave the job's token in .git/config where build scripts
          # could read it. Nothing here pushes.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts blocks dependency lifecycle scripts, the usual
      # foothold for a compromised package. Verified: the build doesn't
      # need them.
      - run: npm ci --ignore-scripts

      - name: Build (fetches city data once)
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          # Read both namespaces so either home works. The token is public by
          # design — it's compiled into the bundle and served to every visitor,
          # so a secret buys no confidentiality (URL-restricting it in the
          # Mapbox dashboard is what actually protects the quota); a secret
          # does mask it in logs, which is a fair reason to prefer one.
          # Reading only one namespace failed silently: the unset expression is
          # just empty, so the build passes and the site deploys with travel
          # times switched off.
          #
          # Repository scope either way — an *environment* secret is visible
          # only to jobs declaring that environment, and this job deliberately
          # joins none (it runs third-party code, so it stays least-privileged).
          PUBLIC_MAPBOX_TOKEN: ${{ vars.PUBLIC_MAPBOX_TOKEN || secrets.PUBLIC_MAPBOX_TOKEN }}
        run: |
          npm run build
          cp .city-cache/stamp.txt build/stamp.txt

      # Without a token the site still builds and lists every swim — it just
      # can't show walk/bike/transit times or a top pick. That is a legitimate
      # deploy, so warn rather than fail; the point is that it stops being
      # invisible. Only ever reports whether a token arrived, never its value.
      - name: Report whether travel times are enabled
        run: |
          if grep -q 'mapboxToken:null' build/index.html; then
            echo "::warning::No PUBLIC_MAPBOX_TOKEN reached the build — deploying without walk/bike/transit times. Add it under Settings → Secrets and variables → Actions as a repository secret or variable (an environment secret will not reach this job)."
            echo 'Travel times: **off** — no `PUBLIC_MAPBOX_TOKEN` reached the build.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Travel times: **on**.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can publish or mint an OIDC token, and it runs no
    # project code — just the deploy action against the built artifact.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
